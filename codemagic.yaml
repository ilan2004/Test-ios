workflows:
  # Test build with automatic signing (creates IPA)
  ios-test-build:
    name: iOS Test Build (Auto Signing)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "SimpleRoutingApp.xcodeproj"
        XCODE_SCHEME: "SimpleRoutingApp"
      xcode: latest
    scripts:
      - name: Build IPA with automatic signing
        script: |
          set -e
          echo "Building iOS app with automatic signing..."
          
          # Use Codemagic's built-in IPA creation (with automatic signing)
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'" \
            --export-options-plist export-options.plist
            
          echo "IPA created successfully!"
      - name: Create export options plist
        script: |
          cat > export-options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <false/>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          EOF
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # Full production build with signing (requires Apple Developer account)
  ios-production:
    name: iOS Production Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.SimpleRoutingApp  # Change this!
      vars:
        XCODE_PROJECT: "SimpleRoutingApp.xcodeproj"
        XCODE_SCHEME: "SimpleRoutingApp"
        BUNDLE_ID: "com.yourcompany.SimpleRoutingApp"  # Change this!
      xcode: latest
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Configure code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
