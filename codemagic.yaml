workflows:
  # Simple build that creates an unsigned IPA
  ios-unsigned-ipa:
    name: iOS Unsigned IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      vars:
        XCODE_PROJECT: "SimpleRoutingApp.xcodeproj"
        XCODE_SCHEME: "SimpleRoutingApp"
      xcode: latest
    scripts:
      - name: Build unsigned app and create IPA
        script: |
          set -e
          echo "Building unsigned iOS app..."
          
          # Build the app without signing
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$HOME/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
            
          # Find the built app
          APP_PATH=$(find "$HOME/DerivedData/Build/Products" -name "SimpleRoutingApp.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Create IPA file
          zip -r SimpleRoutingApp-unsigned.ipa Payload/
          
          echo "Unsigned IPA created: SimpleRoutingApp-unsigned.ipa"
          ls -la *.ipa
    artifacts:
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
  
  # Signed build for real devices (requires Apple Developer account)  
  ios-signed-ipa:
    name: iOS Signed IPA (Requires Dev Account)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.test.SimpleRoutingApp
      vars:
        XCODE_PROJECT: "SimpleRoutingApp.xcodeproj"
        XCODE_SCHEME: "SimpleRoutingApp"
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true

  # Full production build with signing (requires Apple Developer account)
  ios-production:
    name: iOS Production Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.SimpleRoutingApp  # Change this!
      vars:
        XCODE_PROJECT: "SimpleRoutingApp.xcodeproj"
        XCODE_SCHEME: "SimpleRoutingApp"
        BUNDLE_ID: "com.yourcompany.SimpleRoutingApp"  # Change this!
      xcode: latest
    scripts:
      - name: Set up keychain for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Configure code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
